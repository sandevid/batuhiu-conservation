<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="#0A4A5C"/>
  
  <!-- Turtle icon centered and scaled -->
  <g transform="translate(256, 256) scale(3.2)">
    <!-- Main shell -->
    <ellipse cx="0" cy="0" rx="30" ry="24" stroke="#F5E6D3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Shell pattern -->
    <path d="M0 -24 L0 24" stroke="#F5E6D3" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M-26 -8 Q0 -14 26 -8" stroke="#F5E6D3" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M-26 8 Q0 14 26 8" stroke="#F5E6D3" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Head (right side) -->
    <circle cx="30" cy="-4" r="5.5" fill="#F5E6D3"/>
    
    <!-- Front flipper -->
    <path d="M-26 -18 Q-36 -28 -40 -20 Q-36 -12 -24 -12" fill="#F5E6D3" fill-opacity="0.3" stroke="#F5E6D3" stroke-width="2"/>
    
    <!-- Back flipper -->
    <path d="M-26 18 Q-36 28 -40 20 Q-36 12 -24 12" fill="#F5E6D3" fill-opacity="0.3" stroke="#F5E6D3" stroke-width="2"/>
  </g>
</svg>
