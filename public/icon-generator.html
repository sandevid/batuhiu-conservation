
<!DOCTYPE html>
<html>
<head>
  <title>Icon Converter</title>
  <style>
    body { font-family: system-ui; padding: 20px; }
    canvas { border: 1px solid #ccc; margin: 10px; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Turtle Icon Generator</h1>
  <p>Right-click on each canvas and "Save image as..." to download the PNG files.</p>
  
  <div>
    <h3>favicon.ico (32x32)</h3>
    <canvas id="favicon" width="32" height="32"></canvas>
    <button onclick="download('favicon', 32)">Download favicon.ico</button>
  </div>
  
  <div>
    <h3>icon.png (32x32)</h3>
    <canvas id="icon32" width="32" height="32"></canvas>
    <button onclick="download('icon32', 32, 'icon.png')">Download icon.png</button>
  </div>
  
  <div>
    <h3>apple-icon.png (180x180)</h3>
    <canvas id="apple" width="180" height="180"></canvas>
    <button onclick="download('apple', 180, 'apple-icon.png')">Download apple-icon.png</button>
  </div>
  
  <div>
    <h3>icon-192.png (192x192)</h3>
    <canvas id="icon192" width="192" height="192"></canvas>
    <button onclick="download('icon192', 192, 'icon-192.png')">Download icon-192.png</button>
  </div>
  
  <div>
    <h3>icon-512.png (512x512)</h3>
    <canvas id="icon512" width="512" height="512"></canvas>
    <button onclick="download('icon512', 512, 'icon-512.png')">Download icon-512.png</button>
  </div>

  <script>
    const svg = `<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#0A4A5C"/>
  <g transform="translate(256, 256)">
    <!-- Main shell -->
    <ellipse cx="0" cy="0" rx="120" ry="96" stroke="#F5E6D3" stroke-width="12" fill="none"/>
    <!-- Shell pattern -->
    <path d="M0 -96 L0 96" stroke="#F5E6D3" stroke-width="8" opacity="0.5"/>
    <path d="M-104 -32 Q0 -56 104 -32" stroke="#F5E6D3" stroke-width="8" opacity="0.5"/>
    <path d="M-104 32 Q0 56 104 32" stroke="#F5E6D3" stroke-width="8" opacity="0.5"/>
    <!-- Head -->
    <circle cx="120" cy="-16" r="22" fill="#F5E6D3"/>
    <!-- Front flipper -->
    <path d="M-104 -72 Q-144 -112 -160 -80 Q-144 -48 -96 -48" fill="#F5E6D3" fill-opacity="0.3" stroke="#F5E6D3" stroke-width="8"/>
    <!-- Back flipper -->
    <path d="M-104 72 Q-144 112 -160 80 Q-144 48 -96 48" fill="#F5E6D3" fill-opacity="0.3" stroke="#F5E6D3" stroke-width="8"/>
  </g>
</svg>`;
    
    function drawIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      const img = new Image();
      
      img.onload = function() {
        ctx.drawImage(img, 0, 0, size, size);
      };
      
      const blob = new Blob([svg], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      img.src = url;
    }
    
    function download(canvasId, size, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename || canvasId + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    
    // Draw all icons
    drawIcon('favicon', 32);
    drawIcon('icon32', 32);
    drawIcon('apple', 180);
    drawIcon('icon192', 192);
    drawIcon('icon512', 512);
  </script>
</body>
</html>
