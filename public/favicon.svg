<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" fill="#0A4A5C"/>
  
  <!-- Turtle icon centered and scaled -->
  <g transform="translate(64, 64) scale(1.4)">
    <!-- Main shell -->
    <ellipse cx="0" cy="0" rx="30" ry="24" stroke="#F5E6D3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Shell pattern -->
    <path d="M0 -24 L0 24" stroke="#F5E6D3" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M-26 -8 Q0 -14 26 -8" stroke="#F5E6D3" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M-26 8 Q0 14 26 8" stroke="#F5E6D3" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Head (right side) -->
    <circle cx="30" cy="-4" r="5.5" fill="#F5E6D3"/>
    
    <!-- Front flipper -->
    <path d="M-26 -18 Q-36 -28 -40 -20 Q-36 -12 -24 -12" fill="#F5E6D3" fill-opacity="0.3" stroke="#F5E6D3" stroke-width="1.5"/>
    
    <!-- Back flipper -->
    <path d="M-26 18 Q-36 28 -40 20 Q-36 12 -24 12" fill="#F5E6D3" fill-opacity="0.3" stroke="#F5E6D3" stroke-width="1.5"/>
  </g>
</svg>
